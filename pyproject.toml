[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autodev"
dynamic = ["version"]
description = "Policy-first autonomous development control plane for Codex"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["jsonschema>=4.26,<5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
autodev = "autodev.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "autodev.__version__"}

[tool.setuptools.package-data]
autodev = [
  "resources/*.json",
  "resources/schemas/*.json",
  "resources/templates/.codex/agents/*.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
